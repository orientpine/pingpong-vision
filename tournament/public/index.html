<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070f24">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>PINGPONG VISION</title>
  <meta name="apple-mobile-web-app-title" content="PINGPONG VISION">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="preload" href="/fonts/Galmuri11.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/Galmuri11-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/Galmuri9.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app"><p class="loading" id="boot-text"></p></div>
  <script>
    // the first paint, before /i18n.js loads: the same device language key (pp-lang)
    let en = false;
    try { en = localStorage.getItem('pp-lang') === 'en'; } catch {}
    document.documentElement.lang = en ? 'en' : 'ko';
    document.getElementById('boot-text').textContent = en ? 'Loading…' : '불러오는 중…'; // i18n-data: the boot text pair
  </script>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="modal"></dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
